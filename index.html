<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Satellite Simulation</title>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23020814"/><circle cx="32" cy="32" r="18" fill="%236fe2ff"/><circle cx="32" cy="32" r="9" fill="%23ff9933"/></svg>'>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

    <style>
        :root {
            --panel-bg: rgba(6, 15, 28, 0.9);
            --panel-border: rgba(111, 226, 255, 0.6);
            --text-main: #edf7ff;
            --text-dim: #99b7c8;
            --accent: #6fe2ff;
            --warning: #ffd166;
            --danger: #ff7b7b;
            --success: #7cf29a;
            --severity-danger: #ff7b7b;
            --severity-warning: #ffd166;
            --severity-success: #7cf29a;
            --severity-info: #6fe2ff;
            --indian: #ff9933;            --indian-soft: rgba(255, 153, 51, 0.18);
        }

        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background: #020814;
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(111, 226, 255, 0.08), transparent 28%),
                radial-gradient(circle at bottom right, rgba(255, 153, 51, 0.08), transparent 24%),
                #020814;
        }

        .cesium-viewer-bottom {
            display: none !important;
        }

        .panel {
            position: absolute;
            z-index: 10;
            color: var(--text-main);
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
        }

        .panel-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .panel-header-copy {
            min-width: 0;
        }

        .glow-line {
            width: 84px;
            height: 4px;
            margin-bottom: 14px;
            border-radius: 999px;
            background: linear-gradient(90deg, #6fe2ff, #ff9933);
            box-shadow: 0 0 18px rgba(111, 226, 255, 0.45);
        }

        .panel-toggle {
            width: auto;
            min-width: 44px;
            padding: 8px 12px;
            margin-bottom: 0;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            flex-shrink: 0;
        }

        .panel-toggle:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        #controlsPanel {
            top: 20px;
            left: 20px;
            width: min(390px, calc(100vw - 40px));
            padding: 18px;
            max-height: calc(100vh - 140px);
            overflow-y: auto;
        }

        #controlsPanel.collapsed {
            width: min(390px, calc(100vw - 40px));
            max-height: none;
            overflow: hidden;
        }

        #controlsPanel.collapsed #controlsContent {
            display: none;
        }

        #analysisPanel {
            top: 20px;
            right: 20px;
            width: min(410px, calc(100vw - 40px));
            max-height: calc(100vh - 140px);
            overflow-y: auto;
            padding: 18px;
        }

        #moduleDockContainer {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 18px;
            z-index: 12;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), bottom 0.4s ease;
        }

        #moduleDockContainer.collapsed {
            transform: translate(-50%, calc(100% - 32px));
            bottom: 0;
        }

        #moduleDockToggle {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            padding: 6px 20px;
            font-size: 10px;
            font-weight: 800;
            color: var(--accent);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            backdrop-filter: blur(14px);
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.3);
            width: auto;
            margin-bottom: -1px;
            z-index: 13;
            transition: background 0.2s ease, color 0.2s ease;
        }

        #moduleDockToggle:hover {
            background: rgba(111, 226, 255, 0.1);
            color: #fff;
        }

        #moduleDock {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: 14px;
            border: 1px solid var(--panel-border);
            background: rgba(6, 15, 28, 0.92);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(14px);
            width: max-content;
            max-width: calc(100vw - 40px);
            box-sizing: border-box;
            overflow-x: auto;
            scrollbar-width: thin;
        }

        .dock-item {
            flex: 0 0 auto;
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            min-width: 0;
            margin-bottom: 0;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(111, 226, 255, 0.18);
            background: rgba(14, 25, 41, 0.65);
            color: var(--text-main);
            font-size: 12px;
            line-height: 1.25;
            text-align: left;
            cursor: pointer;
            font-weight: 500;
            transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
        }

        .dock-item:hover {
            transform: translateY(-1px);
            border-color: rgba(111, 226, 255, 0.55);
        }

        .dock-item .dock-eyebrow {
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .dock-item .dock-label {
            font-weight: 700;
            color: var(--text-main);
            font-size: 13px;
        }

        .dock-item.is-active {
            background: linear-gradient(135deg, rgba(111, 226, 255, 0.18), rgba(255, 153, 51, 0.12));
            border-color: rgba(111, 226, 255, 0.85);
            box-shadow: 0 0 0 1px rgba(111, 226, 255, 0.25);
        }

        .dock-item.is-placeholder {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .dock-item.is-placeholder:hover {
            transform: none;
        }

        @media (max-width: 900px) {
            #controlsPanel, #analysisPanel {
                max-height: 38vh;
            }

            #moduleDock {
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                bottom: 12px;
                width: max-content;
                max-width: calc(100vw - 32px);
            }
        }

        #hoverPanel {
            position: absolute;
            display: none;
            pointer-events: none;
            z-index: 11;
            background: rgba(4, 10, 20, 0.92);
            color: var(--accent);
            border: 1px solid rgba(111, 226, 255, 0.5);
            border-radius: 10px;
            padding: 10px 12px;
            font-family: Consolas, monospace;
            font-size: 12px;
            min-width: 180px;
        }

        .eyebrow {
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
        }

        h1, h2 {
            margin: 0 0 12px;
            font-size: 20px;
            line-height: 1.2;
        }

        h2 {
            font-size: 18px;
        }

        p {
            margin: 0 0 12px;
            color: var(--text-dim);
            line-height: 1.45;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        select, button, input[type="range"] {
            width: 100%;
            border-radius: 10px;
            border: 1px solid rgba(111, 226, 255, 0.35);
            padding: 10px 12px;
            font-size: 14px;
            box-sizing: border-box;
        }

        select, input[type="range"] {
            background: rgba(14, 25, 41, 0.9);
            color: var(--text-main);
        }

        input[type="range"] {
            padding: 0;
            height: 40px;
        }

        button {
            cursor: pointer;
            background: linear-gradient(135deg, #124866, #2579a0);
            color: white;
            font-weight: 600;
            margin-bottom: 10px;
            transition: transform 140ms ease, box-shadow 140ms ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(11, 43, 61, 0.35);
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
        }

        button.danger {
            background: linear-gradient(135deg, #7c1d1d, #d14a4a);
            color: white;
            border-color: rgba(255, 123, 123, 0.75);
        }

        button.danger:hover {
            box-shadow: 0 10px 24px rgba(124, 29, 29, 0.35);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Dock chips: override global `select, button { width: 100% }` — size to label, no full-width stretch */
        #moduleDock .dock-item {
            width: auto;
            max-width: 100%;
            margin-bottom: 0;
        }

        .status-line, .micro-card {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.03));
            color: var(--text-dim);
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .micro-card {
            margin-top: 0;
        }

        .alert-card {
            margin-top: 12px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
        }

        .alert-card.alert-active {
            border-color: rgba(255, 123, 123, 0.75);
            background: rgba(255, 123, 123, 0.12);
            box-shadow: 0 0 0 1px rgba(255, 123, 123, 0.18);
        }

        .alert-card.alert-monitor {
            border-color: rgba(255, 209, 102, 0.65);
            background: rgba(255, 209, 102, 0.10);
            box-shadow: 0 0 0 1px rgba(255, 209, 102, 0.12);
        }

        .alert-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }

        .alert-title-row strong {
            font-size: 14px;
        }

        .alert-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 72px;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #04111f;
            background: var(--success);
            font-weight: 700;
        }

        .alert-pill.alert-monitor {
            background: var(--warning);
        }

        .alert-pill.alert-active {
            background: var(--danger);
            color: white;
        }

        .alert-meta {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.5;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .metric-card {
            background: linear-gradient(180deg, rgba(11, 33, 50, 0.8), rgba(7, 22, 35, 0.9));
            border: 1px solid rgba(111, 226, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
        }

        .metric-card .label {
            color: var(--text-dim);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .metric-card .value {
            font-size: 22px;
            margin-top: 6px;
            font-weight: 700;
        }

        .legend {
            display: grid;
            gap: 8px;
            margin-top: 8px;
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
            font-size: 13px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            display: inline-block;
        }

        .section {
            margin-top: 16px;
        }

        .section-title {
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .list {
            display: grid;
            gap: 8px;
        }

        .list-item {
            background: rgba(255, 255, 255, 0.04);
            border-left: 3px solid rgba(111, 226, 255, 0.45);
            border-radius: 8px;
            padding: 10px 12px;
            line-height: 1.4;
        }

        .list-item strong {
            display: block;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .warning {
            border-left-color: var(--warning);
        }

        .danger {
            border-left-color: var(--danger);
        }

        .success {
            border-left-color: var(--success);
        }

        .indian {
            border-left-color: var(--indian);
        }

        .info {
            border-left-color: var(--severity-info);
        }

        .hint {
            color: var(--text-dim);
            font-size: 13px;
        }

        .split {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .readout {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 6px;
        }

        .sat-list {
            display: grid;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .filter-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 96px;
            gap: 8px;
            align-items: stretch;
        }

        .filter-item.is-hidden .filter-item-main {
            opacity: 0.58;
        }

        .sat-item {
            border: 1px solid rgba(255, 153, 51, 0.25);
            background: rgba(255, 153, 51, 0.08);
            color: var(--text-main);
            border-radius: 10px;
            padding: 10px 12px;
            text-align: left;
            cursor: pointer;
            font-size: 13px;
        }

        .sat-item small {
            display: block;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .filter-action {
            margin-bottom: 0;
            height: 100%;
            padding: 10px;
        }

        .inline-actions {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
        }

        .search-input {
            width: 100%;
            border-radius: 10px;
            border: 1px solid rgba(111, 226, 255, 0.35);
            padding: 10px 12px;
            font-size: 14px;
            box-sizing: border-box;
            background: rgba(14, 25, 41, 0.9);
            color: var(--text-main);
        }

        .is-hidden {
            display: none !important;
        }

        .trace-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 999px;
            font-size: 12px;
            color: var(--text-main);
            background: rgba(111, 226, 255, 0.08);
            border: 1px solid rgba(111, 226, 255, 0.2);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-right: 4px;
        }

        .badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .badge-outline {
            border: 1px solid rgba(111, 226, 255, 0.4);
            color: var(--accent);
        }

        .badge-success {
            background: var(--success);
            color: #020814;
        }

        .badge-warning {
            background: var(--warning);
            color: #020814;
        }

        .badge-danger {
            background: var(--danger);
            color: white;
        }

        .badge-info {
            background: var(--accent);
            color: #020814;
        }

        @media (max-width: 900px) {
            #controlsPanel, #analysisPanel {
                width: calc(100vw - 32px);
                left: 16px;
                right: 16px;
            }

            #analysisPanel {
                top: auto;
                bottom: 90px;
                max-height: 38vh;
            }

            #controlsPanel {
                top: 16px;
                max-height: 42vh;
            }
        }
        #globeRotationToggle {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 15;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
            padding: 0;
            margin: 0;
        }

        #globeRotationToggle:hover {
            background: rgba(111, 226, 255, 0.1);
            transform: scale(1.05);
        }

        #globeRotationToggle.is-active {
            background: var(--accent);
            color: #020814;
            box-shadow: 0 0 15px var(--accent);
        }

        #globeRotationToggle svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        @media (max-width: 900px) {
            #globeRotationToggle {
                right: 16px;
                bottom: 80px;
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-spinner {
            border: 4px solid rgba(111, 226, 255, 0.1);
            border-left-color: var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 24px auto;
            box-shadow: 0 0 15px rgba(111, 226, 255, 0.2);
        }

        .loader-container {
            text-align: center;
            padding: 48px 20px;
        }

        .loader-text {
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            margin-top: 16px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .loader-subtext {
            color: var(--text-dim);
            font-size: 12px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <button id="globeRotationToggle" title="Toggle Earth Rotation">
        <svg viewBox="0 0 24 24">
            <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12C20,12.35 19.97,12.69 19.92,13.03L15.42,8.53C15.16,8.27 14.8,8.12 14.41,8.12H13V6A1,1 0 0,0 12,6V8.12H10.12L7.5,5.5C8.78,4.56 10.32,4 12,4M5.08,8.08L10.12,13.12V14.41C10.12,14.8 10.27,15.16 10.53,15.42L12.97,17.86C12.69,17.95 12.35,18 12,18C8.5,18 5.5,15.82 4.34,12.82C4.12,12.56 4,12.28 4,12C4,10.5 4.41,9.14 5.08,8.08M17,17.88L14.41,15.29L15.29,14.41L17.88,17C16.86,17.58 15.68,17.88 14.41,17.88Z" />
        </svg>
    </button>

    <div id="controlsPanel" class="panel">
        <div class="panel-header">
            <div class="panel-header-copy">
                <div class="glow-line"></div>
                <div class="eyebrow" id="moduleEyebrow">Operations Console</div>
                <h1 id="moduleTitle">Modular Operations Console</h1>
                <p id="moduleSubtitle">Select a module from the bottom dock to begin.</p>
            </div>
            <button id="controlsToggle" class="panel-toggle" type="button" aria-expanded="true" aria-controls="controlsContent">Minimize</button>
        </div>

        <div id="controlsContent">
            <div id="moduleSidebarRoot"></div>
            <div class="status-line" id="statusLine">Waiting for satellite catalog to load.</div>
        </div>
    </div>

    <div id="analysisPanel" class="panel">
        <div class="eyebrow">Analysis</div>
        <h2>Selection Required</h2>
        <p class="hint">Trace a region on the globe to analyze it, or click a satellite to toggle its one-orbit future path.</p>
    </div>

    <div id="hoverPanel">Hover on a satellite</div>

    <div id="moduleDockContainer">
        <button id="moduleDockToggle" type="button">Hide Dock</button>
        <nav id="moduleDock" aria-label="Operational module dock"></nav>
    </div>

    <div id="bsTimelineContainer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.0.0/satellite.min.js"></script>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Cesium.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
