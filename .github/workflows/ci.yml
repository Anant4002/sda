name: ci

on:
    push:
    pull_request:

jobs:
    validate:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: Satellite
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: 1234
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DB_NAME: Satellite
            DB_USER: postgres
            DB_PASSWORD: 1234
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            PORT: 3000

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm ci

            - name: Wait for PostgreSQL
              run: |
                  sudo apt-get update
                  sudo apt-get install -y postgresql-client
                  until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do
                    echo "Waiting for PostgreSQL..."
                    sleep 2
                  done

            -   name: Debug environment
                run: |
                    echo "DB_HOST=$DB_HOST"
                    echo "DB_PORT=$DB_PORT"
                    echo "DB_NAME=$DB_NAME"

            -   name: Check postgres container
                run: docker ps

            -   name: Install postgres client
                run: sudo apt-get update && sudo apt-get install -y postgresql-client

            -   name: Verify postgres connection
                run: |
                    PGPASSWORD=1234 psql -h 127.0.0.1 -U postgres -d Satellite -c "\l"

            - name: Run tests
              run: npm test

            - name: Run checks
              run: npm run check
