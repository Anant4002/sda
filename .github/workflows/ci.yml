    name: ci

    on:
        push:
        pull_request:

    jobs:
        validate:
            runs-on: ubuntu-latest

            services:
                postgres:
                    image: postgres:16
                    env:
                        POSTGRES_DB: Satellite
                        POSTGRES_USER: postgres
                        POSTGRES_PASSWORD: 1234
                    ports:
                        - 5432:5432
                    options: >-
                        --health-cmd="pg_isready -U postgres"
                        --health-interval=10s
                        --health-timeout=5s
                        --health-retries=5

            env:
                DB_NAME: Satellite
                DB_USER: postgres
                DB_PASSWORD: 1234
                DB_HOST: localhost
                DB_PORT: 5432
                PORT: 3000

            steps:
                - uses: actions/checkout@v4

                - uses: actions/setup-node@v4
                  with:
                      node-version: 20

                - run: npm ci

                - run: npm test

                - run: npm run check

